
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewace-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    networks:
      - interviewace-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interviewace-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - interviewace-network

networks:
  interviewace-network:
    driver: bridge
