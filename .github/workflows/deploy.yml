
name: DeployPilot CI/CD

on:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build and Validate Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm workflow started
        run: echo "DeployPilot CI/CD pipeline started!"

      - name: Build backend Docker image
        run: |
          docker build \
            -t interviewace-backend:latest \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t interviewace-frontend:latest \
            -f Dockerfile .

      - name: Display commit information
        run: |
          echo "Commit SHA: $GITHUB_SHA"

      - name: Pipeline completed
        run: echo "Both Docker images built successfully!"
